
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="text-center mt-5">Admin Login</h2>
        <form id="adminLoginForm" class="mt-4">
            <div class="form-group">
                <label for="applicantIdGmail">Applicant ID/Gmail:</label>
                <input type="text" class="form-control" id="applicantIdGmail" name="applicantIdGmail" required>
            </div>
            <div class="form-group">
                <label for="adminPassword">Password:</label>
                <input type="password" class="form-control" id="adminPassword" name="adminPassword" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <script>
        $(document).ready(function(){
            $("#adminLoginForm").on("submit", function(event){
                event.preventDefault();
                // Basic validation
                var applicantIdGmail = $("#applicantIdGmail").val();
                var adminPassword = $("#adminPassword").val();
                if(applicantIdGmail === "" || adminPassword === ""){
                    alert("Please fill all fields.");
                } else {
                    alert("Form submitted successfully.");
                    // Add your form submission code here
                }
            });
        });
    </script>
</body>
</html>
