
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-box input[type="text"], .login-box input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-box .btn {
            background-color: teal;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        .login-box .btn:hover {
            background-color: coral;
        }
        .login-box .form-check-label {
            margin-left: 5px;
        }
        .login-box .form-check-input {
            margin-left: -1.25rem;
        }
        .login-box .show-password {
            cursor: pointer;
            color: teal;
        }
        .login-box .create-account {
            color: coral;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Log In</h2>
        <p>Need an account? <span class="create-account">Create an account</span></p>
        <input type="text" id="applicant-id" placeholder="Applicant ID/Gmail">
        <input type="password" id="password" placeholder="Password">
        <span class="show-password">Show</span>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="keep-logged-in">
            <label class="form-check-label" for="keep-logged-in">Keep me logged in</label>
        </div>
        <button class="btn">Log In</button>
        <button class="btn btn-link">Forgot Password</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.show-password').click(function() {
                var passwordField = $('#password');
                var passwordFieldType = passwordField.attr('type');
                if (passwordFieldType == 'password') {
                    passwordField.attr('type', 'text');
                    $(this).text('Hide');
                } else {
                    passwordField.attr('type', 'password');
                    $(this).text('Show');
                }
            });
        });
    </script>
</body>
</html>
