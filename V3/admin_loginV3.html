
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .form-control {
            border-radius: 25px;
        }
        .btn-pill {
            border-radius: 25px;
            padding: 10px 20px;
            margin: 5px;
        }
        .btn-primary {
            background-color: teal;
            border-color: teal;
        }
        .btn-secondary {
            background-color: coral;
            border-color: coral;
        }
        .form-check-label {
            margin-left: 10px;
        }
        .link {
            color: coral;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" class="form-control" id="employeeId" placeholder="Employee ID/Gmail" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <small class="form-text text-muted">Password must be at least 8 characters long and include letters, numbers, and symbols.</small>
                <input type="checkbox" onclick="togglePassword()"> Show Password
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="keepLoggedIn">
                <label class="form-check-label" for="keepLoggedIn">Keep me logged in</label>
            </div>
            <button type="submit" class="btn btn-pill btn-primary">Log In</button>
            <button type="button" class="btn btn-pill btn-secondary" onclick="window.location.href='forgot_password.html'">Forgot Password</button>
        </form>
        <p>Need an account? <span class="link" onclick="window.location.href='create_account.html'">Create an account</span></p>
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script>
        function togglePassword() {
            var passwordField = document.getElementById("password");
            if (passwordField.type === "password") {
                passwordField.type = "text";
            } else {
                passwordField.type = "password";
            }
        }

        $("#loginForm").submit(function(event) {
            var password = $("#password").val();
            var passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$/;
            if (!passwordPattern.test(password)) {
                alert("Password must be at least 8 characters long and include letters, numbers, and symbols.");
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
