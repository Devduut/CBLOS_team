
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #33cc33;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            justify-content: space-around;
            width: 80%;
        }
        .box {
            background-color: white;
            color: #33cc33;
            border-radius: 15px;
            padding: 20px;
            width: 45%;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .box img {
            width: 100px;
            height: 100px;
        }
        .box h2 {
            margin: 20px 0 10px;
        }
        .box p {
            margin: 10px 0;
        }
        .box a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #33cc33;
            color: white;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 20px;
        }
        .box a:hover {
            background-color: #28a428;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="clientpic.png" alt="Client">
            <h2>Client</h2>
            <p>Access as a client to manage your loans.</p>
            <a href="clv4.html">Log in as Client</a>
        </div>
        <div class="box">
            <img src="adminpic.png" alt="Admin">
            <h2>Admin</h2>
            <p>Access as an administrator to manage the system.</p>
            <a href="alv4.html">Log in as Admin</a>
        </div>
    </div>
</body>
</html>
